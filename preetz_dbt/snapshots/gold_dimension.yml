snapshots:
  - name: gold_layer
    relation: ref('source_dedup_rows')
    config:
      schema: gold
      database: '{{target.catalog}}'
      unique_key: item_id
      strategy: timestamp
      updated_at: updated_at
      dbt_valid_to_current: "to_date('9999-12-31')" #  current records will be set to '9999-12-31'.
